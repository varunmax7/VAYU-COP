[project]
name = "vayu-cop-backend"
version = "0.1.0"
description = "VAYU-COP backend — AI decision support for dynamic air operations & resource optimisation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.2,<3.3",
    "ortools>=9.10,<9.12",
    "scikit-learn>=1.5,<1.6",
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.1",
    "joblib>=1.4,<1.5",
    "shapely>=2.0,<2.1",
    "httpx>=0.27,<0.28",
    "pyjwt>=2.9,<2.10",
    "bcrypt>=4.2,<4.3",
    "reportlab>=4.2,<4.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.6,<0.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Benign FastAPI-internal field cloning for request bodies on models that use
    # an alias_generator (our CamelModel). Verified the camelCase aliasing itself
    # still round-trips correctly end to end; this is pydantic-version noise only.
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
]
testpaths = ["tests"]
